name: Static checks

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  vba-source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check modular VBA sources
        run: python tools/check_vba_sources.py
